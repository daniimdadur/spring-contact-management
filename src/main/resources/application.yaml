spring:
  application:
    name: spring-contact-management
  datasource:
    url: jdbc:mysql://localhost:3306/contact_management
    username: myuser
    password: verysecret
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Jakarta
app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:wdgFBVS9P2joCLJ3eNmknbg3IXlkZBpMOgdpriotWH0=}
    access-expiration: 15
    refresh-expiration: 1440
  cookie:
    secure: ${COOKIE_SECURE:true}
    max-age: 1440
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /api-docs